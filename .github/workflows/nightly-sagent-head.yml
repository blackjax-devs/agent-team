name: nightly-sagent-head

# DRIFT DETECTOR (separate from CI on purpose).
#
# CI (ci.yml) tests against the sagent version uv.lock pins. This workflow
# instead resolves sagent from main HEAD and runs the same suite PLUS the
# sagent-seams smoke, so we learn — nightly — if sagent main drifts away from
# the API agent-team targets, before that lands in a release. (sagent 0.2.0
# reorganised the whole package; this is the job that should have told us.)
# A FAILING run here is the signal that main changed under us: port before
# bumping the lock. It gates nothing — own status.
#
# How: rewrite the sagent dependency in pyproject.toml — in EITHER form (PyPI spec
# such as "sagent>=0.1.8" or the old git-URL pin "sagent @ git+…@<rev>") — to the
# git-main URL "sagent @ git+https://github.com/rekursiv-ai/sagent.git@main" so
# `uv sync` re-resolves to current sagent HEAD.  Fails loudly if no sagent dep is
# found at all, so a future dep-form change doesn't silently pass (it would just
# install the pinned/PyPI sagent instead of HEAD).

on:
  schedule:
    # 04:47 UTC daily — offset from CI's nightly (03:17) and off the hour.
    - cron: "47 4 * * *"
  workflow_dispatch: {}

jobs:
  sagent-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Retarget the sagent dep at upstream HEAD (main)
        run: |
          python - <<'PY'
          import re, pathlib
          p = pathlib.Path("pyproject.toml")
          t = p.read_text()
          # Match sagent in either form:
          #   PyPI spec:   "sagent>=0.1.8"  /  "sagent[extras]>=x"  /  bare "sagent"
          #   git-URL pin: "sagent @ git+https://github.com/rekursiv-ai/sagent.git@<rev>"
          # Replace whichever is present with the git-main URL.
          GIT_MAIN = 'sagent @ git+https://github.com/rekursiv-ai/sagent.git@main'
          pattern = (
              r'"sagent\s*(?:@\s*git\+https://github\.com/rekursiv-ai/sagent\.git@[^\s"]+|'
              r'(?:\[[^\]]*\])?(?:[><=!][^"]*)?)"'
          )
          new, n = re.subn(pattern, f'"{GIT_MAIN}"', t)
          if n == 0:
              raise SystemExit(
                  "no sagent dependency found in pyproject.toml — "
                  "the dep was renamed, removed, or moved to a different file; "
                  "adjust this workflow"
              )
          p.write_text(new)
          PY
          grep -n 'sagent @ git' pyproject.toml

      - name: Sync against sagent HEAD
        # This job follows unreleased upstream code, whose transitive
        # dependencies can intentionally require prerelease packages.
        run: uv sync --prerelease=allow

      - name: Report resolved sagent
        run: uv run python -c "import sagent, importlib.metadata as m; print('sagent', m.version('sagent'), '->', sagent.__file__)"

      - name: Run test suite against sagent HEAD
        run: uvx --prerelease=allow --with-editable . --with pytest --with pytest-asyncio pytest -q

      # The load-bearing check: assert sagent main still offers every class,
      # argument and field agent-team passes it (tests/sagent_seams_test.py).
      # A red run here with the seam named = main renamed or dropped it; do
      # not bump the lock until agent-team is ported.
      - name: sagent seams smoke against sagent HEAD
        run: uvx --prerelease=allow --with-editable . --with pytest --with pytest-asyncio pytest tests/sagent_seams_test.py -q
