name: CI

# Triggers: every push/PR to main, plus a nightly schedule.
#
# agent-team is built on sagent >=0.2 (`sagent>=0.2.3` in pyproject.toml) and
# tests against the versions uv.lock pins: every step below runs in the synced
# project environment (`uv run`), so a new sagent release cannot change what CI
# tests until the lock is refreshed. (It used to run the suite under `uvx`,
# which re-resolves from pyproject.toml and ignores the lock — that is how the
# sagent 0.2.0 release turned a green main red overnight.)
#
# The separate nightly-sagent-head.yml resolves sagent @main instead, to warn
# us of upstream drift before it reaches a release.
#
# Note the SAGENT-SEAMS smoke below: importing agent_team proves little, since
# most of what it passes to sagent is only reached once a team boots. The seams
# test (tests/sagent_seams_test.py) names each sagent class, argument and field
# agent-team relies on, so a rename upstream fails with the seam named. The
# rest of tests/ covers the other half: that agent-team still PASSES them, and
# that a team boots and messages end to end on a scripted model.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 03:17 UTC daily — off the top of the hour to avoid GitHub's cron rush.
    - cron: "17 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Installs the uv.lock versions; used by the `uv run` smokes below.
      - name: Sync dependencies
        run: uv sync

      # pytest + pytest-asyncio come from the `dev` dependency group, at their
      # locked versions (asyncio_mode=auto in pyproject; without pytest-asyncio
      # the async tests would run as silent no-ops).
      - name: Run test suite
        run: uv run --group dev pytest -q

      # Framework import smoke: package import + bundled-default profile load
      # (no AGENT_TEAM_PROFILE_DIR — exercises the in-package default that
      # ships as package data) + serve entry point is callable. Run from a
      # different cwd so it proves the install does not rely on a source path.
      - name: Framework import smoke
        run: |
          cd "$RUNNER_TEMP"
          uv run --project "$GITHUB_WORKSPACE" python -c "import agent_team; from agent_team.team_profile import load_profile; load_profile(); from agent_team.serve import main; assert callable(main)"

      # sagent-seams smoke: assert sagent still offers every class, argument
      # and field agent-team passes it (Agent(...), AnthropicCLI()[model],
      # McpSession/McpServer, SummaryCompactor(summary_tokens=), JsonlJournal,
      # the runtime messages serve.py pushes). A full boot would need claude
      # credentials, which CI lacks — this catches API drift headlessly, and
      # names the seam. (Part of the suite above too; kept as its own step so
      # a drift failure is visible at a glance.)
      - name: sagent seams smoke
        run: uv run --group dev pytest tests/sagent_seams_test.py -q

      # Console-script smoke: --help must print usage and exit 0 without booting.
      - name: Console script --help
        run: uv run agent-team --help
